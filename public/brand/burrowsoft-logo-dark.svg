  <!-- Wordmark (white) -->
  <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="white" letter-spacing="-0.5">BurrowSoft</text>
</svg>
