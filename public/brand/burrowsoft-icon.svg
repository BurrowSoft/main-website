<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="BurrowSoft icon">
  <rect width="200" height="200" rx="38" fill="#1e2d3d"/>
  <g fill="white" stroke="#c7d2fe" stroke-linecap="round" stroke-linejoin="round">
    <!-- Topknot: onion/bulb shape -->
    <path d="M91,30 C88,22 90,8 100,5 C110,8 112,22 109,30 C107,34 93,34 91,30 Z" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="100" cy="83" r="57" stroke-width="3"/>
    <!-- Left lens -->
    <circle cx="81" cy="89" r="19" stroke-width="5"/>
    <!-- Right lens -->
    <circle cx="119" cy="89" r="19" stroke-width="5"/>
    <!-- Bridge -->
    <line x1="100" y1="87" x2="100" y2="92" stroke-width="3.5"/>
    <!-- Temple arms -->
    <line x1="62" y1="89" x2="54" y2="89" stroke-width="3"/>
    <line x1="138" y1="89" x2="146" y2="89" stroke-width="3"/>
    <!-- Left pupil -->
    <circle cx="81" cy="89" r="11" fill="#1e2d3d" stroke="none"/>
    <circle cx="84" cy="86" r="4" fill="white" stroke="none"/>
    <!-- Right pupil -->
    <circle cx="119" cy="89" r="11" fill="#1e2d3d" stroke="none"/>
    <circle cx="122" cy="86" r="4" fill="white" stroke="none"/>
    <!-- Nose -->
    <path d="M96,109 Q100,106 104,109 Q103,115 100,116 Q97,115 96,109 Z" fill="#1e2d3d" stroke="none"/>
    <!-- Ledge -->
    <rect x="20" y="130" width="160" height="18" rx="7" stroke-width="3.5"/>
    <!-- Left hand -->
    <path d="M47,130 L47,124 Q52,113 57,124 Q61,111 67,124 Q71,114 77,124 L77,130 Z" stroke-width="2.5"/>
    <!-- Right hand -->
    <path d="M123,130 L123,124 Q128,114 133,124 Q137,111 143,124 Q147,113 153,124 L153,130 Z" stroke-width="2.5"/>
  </g>
</svg>
