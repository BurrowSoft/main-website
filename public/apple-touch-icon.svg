<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="BurrowSoft app icon">
  <!-- Apple-touch-icon: 180×180 indigo background, mole face centred -->
  <rect width="180" height="180" fill="#4f46e5"/>
  <!-- Scale the mole head to fit: original head spans roughly 43–157 (114px wide) in 200×220 space.
       We want it ~140px wide in 180, scale ≈ 1.23; but let's use a transform to keep it centred. -->
  <g transform="translate(90,90) scale(0.82) translate(-100,-75)" fill="white" stroke="#c7d2fe" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="91" cy="28" r="5" stroke-width="2.5"/>
    <circle cx="100" cy="22" r="6" stroke-width="2.5"/>
    <circle cx="109" cy="28" r="5" stroke-width="2.5"/>
    <circle cx="100" cy="83" r="57" stroke-width="3"/>
    <circle cx="81" cy="89" r="19" stroke-width="3.5"/>
    <circle cx="119" cy="89" r="19" stroke-width="3.5"/>
    <line x1="100" y1="87" x2="100" y2="92" stroke-width="2.5"/>
    <line x1="62" y1="89" x2="52" y2="89" stroke-width="2.5"/>
    <line x1="138" y1="89" x2="148" y2="89" stroke-width="2.5"/>
    <circle cx="81" cy="89" r="9" fill="#312e81" stroke="none"/>
    <circle cx="84" cy="86" r="3.5" fill="white" stroke="none"/>
    <circle cx="119" cy="89" r="9" fill="#312e81" stroke="none"/>
    <circle cx="122" cy="86" r="3.5" fill="white" stroke="none"/>
    <ellipse cx="100" cy="113" rx="6" ry="4.5" fill="#312e81" stroke="none"/>
  </g>
</svg>
