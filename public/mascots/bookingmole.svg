<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="BookingMole mascot">
  <g id="mole-base" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head: half-circle -->
    <path d="M35,155 A65,65 0 0 1 165,155" fill="white" stroke-width="3.5"/>
    <!-- Grass hair -->
    <path d="M94,93 C91,81 87,74 84,62" fill="none" stroke-width="2.5"/>
    <path d="M100,91 C100,79 101,70 102,58" fill="none" stroke-width="2.5"/>
    <path d="M106,93 C109,81 113,74 116,62" fill="none" stroke-width="2.5"/>
    <!-- Glasses -->
    <circle cx="80" cy="123" r="13" stroke-width="4"/>
    <circle cx="120" cy="123" r="13" stroke-width="4"/>
    <path d="M93,123 Q100,127 107,123" fill="none" stroke-width="2.5"/>
    <line x1="67" y1="123" x2="45" y2="119" stroke-width="2.5"/>
    <line x1="133" y1="123" x2="155" y2="119" stroke-width="2.5"/>
    <circle cx="80" cy="123" r="7" fill="#1e2d3d" stroke="none"/>
    <circle cx="120" cy="123" r="7" fill="#1e2d3d" stroke="none"/>
    <!-- Nose -->
    <path d="M96,141 Q100,138 104,141 Q103,148 100,149 Q97,148 96,141 Z" fill="#1e2d3d" stroke="none"/>
    <!-- Grassy soil line -->
    <line x1="5" y1="155" x2="195" y2="155" stroke-width="3.5"/>
    <path d="M10,155 C8,146 6,140 5,131" fill="none" stroke-width="2"/>
    <path d="M15,155 C14,146 13,139 14,130" fill="none" stroke-width="2"/>
    <path d="M21,155 C22,146 24,140 26,131" fill="none" stroke-width="2"/>
    <path d="M179,155 C181,146 183,140 184,131" fill="none" stroke-width="2"/>
    <path d="M185,155 C186,147 188,140 190,133" fill="none" stroke-width="2"/>
    <path d="M191,155 C192,146 193,141 195,133" fill="none" stroke-width="2"/>
    <!-- Left hand (holds cocktail) -->
    <path d="M43,155 L43,147 Q48,136 54,147 Q58,134 64,147 Q68,137 74,147 L74,155 Z" stroke-width="2.5"/>
    <!-- Right hand (holds parasol) -->
    <path d="M126,155 L126,147 Q131,137 137,147 Q141,134 147,147 Q151,136 157,147 L157,155 Z" stroke-width="2.5"/>
  </g>

  <g id="prop" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cocktail glass on top of left hand (centered cx≈58) -->
    <!-- Cup (inverted trapezoid) -->
    <path d="M46,120 L70,120 L62,144 L54,144 Z" stroke-width="2.5"/>
    <!-- Stem -->
    <line x1="58" y1="144" x2="58" y2="153" stroke-width="2.5"/>
    <!-- Base resting on hand -->
    <line x1="52" y1="153" x2="64" y2="153" stroke-width="2.5"/>
    <!-- Olive on pick -->
    <line x1="50" y1="120" x2="66" y2="120" stroke-width="1.5"/>
    <circle cx="58" cy="120" r="4" fill="#a3c464" stroke-width="1.5"/>

    <!-- Beach parasol — LARGE, on right side -->
    <!-- Pole (tall, slightly angled) -->
    <line x1="152" y1="218" x2="138" y2="86" stroke-width="3"/>
    <!-- Pole tip -->
    <circle cx="138" cy="86" r="4" fill="#1e2d3d" stroke="none"/>
    <!-- Canopy (wide arc) -->
    <path d="M92,118 Q138,78 188,118" fill="none" stroke-width="3"/>
    <path d="M92,118 Q115,100 138,92 Q161,100 188,118 Q165,126 138,124 Q111,126 92,118 Z" stroke-width="2.5"/>
    <!-- Canopy ribs -->
    <line x1="92" y1="118" x2="138" y2="92" stroke-width="1.5"/>
    <line x1="188" y1="118" x2="138" y2="92" stroke-width="1.5"/>
    <line x1="138" y1="78" x2="138" y2="92" stroke-width="2"/>
    <line x1="115" y1="104" x2="138" y2="92" stroke-width="1.5"/>
    <line x1="161" y1="104" x2="138" y2="92" stroke-width="1.5"/>
  </g>
</svg>
