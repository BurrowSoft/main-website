<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="InsightMole mascot">
  <g id="mole-base" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head: half-circle -->
    <path d="M35,155 A65,65 0 0 1 165,155" fill="white" stroke-width="3.5"/>
    <!-- Grass hair -->
    <path d="M94,93 C91,81 87,74 84,62" fill="none" stroke-width="2.5"/>
    <path d="M100,91 C100,79 101,70 102,58" fill="none" stroke-width="2.5"/>
    <path d="M106,93 C109,81 113,74 116,62" fill="none" stroke-width="2.5"/>
    <!-- Glasses -->
    <circle cx="80" cy="123" r="13" stroke-width="4"/>
    <circle cx="120" cy="123" r="13" stroke-width="4"/>
    <path d="M93,123 Q100,127 107,123" fill="none" stroke-width="2.5"/>
    <line x1="67" y1="123" x2="45" y2="119" stroke-width="2.5"/>
    <line x1="133" y1="123" x2="155" y2="119" stroke-width="2.5"/>
    <!-- Eyes: smaller, full black -->
    <circle cx="80" cy="123" r="7" fill="#1e2d3d" stroke="none"/>
    <circle cx="120" cy="123" r="7" fill="#1e2d3d" stroke="none"/>
    <!-- Nose -->
    <path d="M96,141 Q100,138 104,141 Q103,148 100,149 Q97,148 96,141 Z" fill="#1e2d3d" stroke="none"/>
    <!-- Grassy soil line -->
    <line x1="5" y1="155" x2="195" y2="155" stroke-width="3.5"/>
    <path d="M10,155 C8,146 6,140 5,131" fill="none" stroke-width="2"/>
    <path d="M15,155 C14,146 13,139 14,130" fill="none" stroke-width="2"/>
    <path d="M21,155 C22,146 24,140 26,131" fill="none" stroke-width="2"/>
    <path d="M179,155 C181,146 183,140 184,131" fill="none" stroke-width="2"/>
    <path d="M185,155 C186,147 188,140 190,133" fill="none" stroke-width="2"/>
    <path d="M191,155 C192,146 193,141 195,133" fill="none" stroke-width="2"/>
    <!-- Left hand (raised to hold newspaper) -->
    <path d="M38,148 L38,140 Q43,129 49,140 Q53,127 59,140 Q63,130 69,140 L69,148 Z" stroke-width="2.5"/>
    <!-- Right hand (raised to hold newspaper) -->
    <path d="M131,148 L131,140 Q136,130 142,140 Q146,127 152,140 Q156,129 162,140 L162,148 Z" stroke-width="2.5"/>
  </g>

  <g id="prop" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Newspaper — open spread -->
    <!-- Left page -->
    <rect x="20" y="100" width="70" height="50" rx="2" stroke-width="2.5"/>
    <!-- Headline (left) -->
    <rect x="26" y="107" width="58" height="6" rx="1" fill="#1e2d3d" stroke="none"/>
    <!-- Article lines (left) -->
    <line x1="26" y1="118" x2="84" y2="118" stroke-width="1.5" opacity="0.6"/>
    <line x1="26" y1="123" x2="84" y2="123" stroke-width="1.5" opacity="0.6"/>
    <line x1="26" y1="128" x2="80" y2="128" stroke-width="1.5" opacity="0.6"/>
    <line x1="26" y1="133" x2="76" y2="133" stroke-width="1.5" opacity="0.6"/>
    <line x1="26" y1="138" x2="70" y2="138" stroke-width="1.5" opacity="0.6"/>

    <!-- Right page -->
    <rect x="110" y="100" width="70" height="50" rx="2" stroke-width="2.5"/>
    <!-- Headline (right) -->
    <rect x="116" y="107" width="58" height="6" rx="1" fill="#1e2d3d" stroke="none"/>
    <!-- Article lines (right) -->
    <line x1="116" y1="118" x2="174" y2="118" stroke-width="1.5" opacity="0.6"/>
    <line x1="116" y1="123" x2="174" y2="123" stroke-width="1.5" opacity="0.6"/>
    <line x1="116" y1="128" x2="170" y2="128" stroke-width="1.5" opacity="0.6"/>
    <line x1="116" y1="133" x2="166" y2="133" stroke-width="1.5" opacity="0.6"/>
    <line x1="116" y1="138" x2="160" y2="138" stroke-width="1.5" opacity="0.6"/>

    <!-- Center fold -->
    <line x1="100" y1="100" x2="100" y2="150" stroke-width="2"/>
  </g>
</svg>
